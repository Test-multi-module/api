spring:
  docker:
    compose:
      enabled: ${SPRING_DOCKER_COMPOSE_ENABLED:false}
      file: local-development/docker-compose.yml
  datasource:
    url: ${DB_URL}
    username: ${DB_USER_NAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, email, profile
        provider:
          google:
            issuer-uri: https://accounts.google.com
logging:
  level:
    org.flywaydb: DEBUG
    org.springframework.web: DEBUG
    org.springframework.web.filter.CommonsRequestLoggingFilter: DEBUG
api:
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS}
    jwt:
      truststore:
        location: ${TRUST_STORE_PATH}
        store-password: ${JWT_TRUSTSTORE_PASSWORD}
        type: PKCS12
        alias: ${ALIAS}
      issuer: "testproj-auth"
      audience: "testproj-api"
auth:
  login-redirect-url: ${LOGIN_REDIRECT_URL}
  login-code-ttl-seconds: 60
  login-code-pepper: ${LOGIN_CODE_PEPPER}
  security:
    jwt:
      issuer: "testproj-auth"
      access-token-props:
        audience: "testproj-api"
        ttl-seconds: 900
      keystore:
        type: PKCS12
        location: ${KEY_STORE_PATH}
        store-password: ${JWT_KEYSTORE_PASSWORD}
        key-alias: ${KEY_ALIAS}
        key-password: ${JWT_KEY_PASSWORD}