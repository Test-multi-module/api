spring:
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_SENDER_USERNAME}
    password: ${GMAIL_SENDER_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USER_NAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, email, profile
        provider:
          google:
            issuer-uri: https://accounts.google.com
logging:
  level:
    org.flywaydb: DEBUG
    org.springframework.web: DEBUG
    org.springframework.web.filter.CommonsRequestLoggingFilter: DEBUG
api:
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS}
    jwt:
      issuer: "testproj-auth"
      audience: "testproj-api"
      jwk-set-uri: ${JWK_SET_URI}
auth:
  security:
    oauth2-login:
      redirect-url: ${LOGIN_REDIRECT_URL}
      exchange-code:
        ttl-seconds: 60
        pepper: ${LOGIN_CODE_PEPPER}
    email-verification:
      code:
        ttl-seconds: 300
        pepper: ${EMAIL_VERIFICATION_CODE_PEPPER}
        attempts: ${EMAIL_VERIFICATION_CODE_ATTEMPTS}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS}
    jwt:
      issuer: "testproj-auth"
      audience:
        - testproj-api
      access-token:
        audience: "testproj-api"
        ttl-seconds: 900
      keystore:
        type: PKCS12
        location: ${KEY_STORE_PATH}
        store-password: ${JWT_KEYSTORE_PASSWORD}
        key-alias: ${KEY_ALIAS}
        key-password: ${JWT_KEY_PASSWORD}