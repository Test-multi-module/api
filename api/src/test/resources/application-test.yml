api:
  security:
    jwt:
      truststore:
        location: classpath:keys/test-truststore.p12
        store-password: Test!123
        type: PKCS12
        alias: test-keypair
      issuer: "testproj-auth"
      audience: "testproj-api"
auth:
  security:
    oauth2-login:
      redirect-url: "http://localhost:4200/auth/callback"
      exchange-code:
        ttl-seconds: 60
        pepper: "strongsecretpepper"
    jwt:
      keystore:
        location: classpath:keys/test-keystore.p12
        store-password: Test!123
        key-alias: test-keypair
        key-password: Test!123